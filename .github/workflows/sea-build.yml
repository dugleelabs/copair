name: Build SEA Binaries

on:
  release:
    types: [published]

jobs:
  build-sea:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm build:sea

      - name: Upload binary (unix)
        if: matrix.platform != 'win32'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv copair "copair-${{ matrix.platform }}-${{ matrix.arch }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "./copair-${{ matrix.platform }}-${{ matrix.arch }}" --clobber

      - name: Upload binary (windows)
        if: matrix.platform == 'win32'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rename-Item copair.exe "copair-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          gh release upload "${{ github.event.release.tag_name }}" "copair-${{ matrix.platform }}-${{ matrix.arch }}.exe" --clobber

  # ── Validate uploaded binaries on each platform ─────────────────
  validate-binaries:
    name: Validate ${{ matrix.platform }}-${{ matrix.arch }}
    needs: build-sea
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            binary: copair-darwin-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            binary: copair-linux-x64
          - os: windows-latest
            platform: win32
            arch: x64
            binary: copair-win32-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo dugleelabs/copair \
            --pattern "${{ matrix.binary }}"

      - name: Validate binary (unix)
        if: matrix.platform != 'win32'
        run: |
          chmod +x "${{ matrix.binary }}"
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          OUTPUT=$(./${{ matrix.binary }} --version)
          echo "Expected: ${VERSION}, Got: ${OUTPUT}"
          [ "$OUTPUT" = "$VERSION" ] || { echo "Version mismatch"; exit 1; }

          ./${{ matrix.binary }} --help > /dev/null
          echo "${{ matrix.binary }}: OK"

      - name: Validate binary (windows)
        if: matrix.platform == 'win32'
        run: |
          $TAG = "${{ github.event.release.tag_name }}"
          $VERSION = $TAG -replace '^v', ''

          $OUTPUT = .\${{ matrix.binary }} --version
          Write-Host "Expected: $VERSION, Got: $OUTPUT"
          if ($OUTPUT -ne $VERSION) { Write-Error "Version mismatch"; exit 1 }

          .\${{ matrix.binary }} --help | Out-Null
          Write-Host "${{ matrix.binary }}: OK"

  # ── Update Homebrew formula after binaries are validated ─────────
  update-homebrew:
    name: Update Homebrew formula
    needs: validate-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"

          for BINARY in copair-darwin-arm64 copair-linux-x64; do
            gh release download "${TAG}" \
              --repo dugleelabs/copair \
              --pattern "${BINARY}"
            SHA=$(sha256sum "${BINARY}" | awk '{print $1}')
            # copair-darwin-arm64 -> darwin_arm64
            KEY=$(echo "${BINARY}" | sed 's/copair-//' | tr '-' '_')
            echo "${KEY}=${SHA}" >> "$GITHUB_OUTPUT"
            echo "${BINARY}: ${SHA}"
          done

          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: dugleelabs/homebrew-tap
          token: ${{ secrets.DUGLEEBOT_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${{ steps.sha.outputs.version }}"
          BASE="https://github.com/dugleelabs/copair/releases/download/${TAG}"

          cat > homebrew-tap/Formula/copair.rb <<FORMULA_EOF
          class Copair < Formula
            desc "Model-agnostic AI coding agent for the terminal"
            homepage "https://github.com/dugleelabs/copair"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "${BASE}/copair-darwin-arm64"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE}/copair-linux-x64"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
            end

            def install
              binary = Dir["copair-*"].first || "copair"
              bin.install binary => "copair"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/copair --version")
            end
          end
          FORMULA_EOF

          # Strip leading whitespace from heredoc (indented for YAML readability)
          sed 's/^          //' homebrew-tap/Formula/copair.rb > homebrew-tap/Formula/copair.rb.tmp
          mv homebrew-tap/Formula/copair.rb.tmp homebrew-tap/Formula/copair.rb

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "dugleebot"
          git config user.email "223939725+dugleebot@users.noreply.github.com"
          git add Formula/copair.rb
          git commit -m "copair ${{ steps.sha.outputs.version }} (SEA binary)"
          git push
