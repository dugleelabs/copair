name: Build and Publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish @dugleelabs/copair to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm publish --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm test

      - name: Publish @dugleelabs/copair
        # --no-git-checks: semantic-release publishes from a tagged release ref,
        # so pnpm's clean-tree + correct-branch check would false-positive here.
        # Do NOT copy this flag into manual/local publishes.
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
