name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: '^[a-zA-Z].+$'

  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & typecheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm lint
          pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm test

  sea-smoke-test:
    name: SEA Smoke Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea

      - name: Verify SEA binary (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="copair ${VERSION} (community)"
          OUTPUT=$(./copair --version)
          echo "Expected: ${EXPECTED}, Got: ${OUTPUT}"
          [ "$OUTPUT" = "$EXPECTED" ] || { echo "Version mismatch"; exit 1; }
          ./copair --help > /dev/null

      - name: Verify SEA binary (windows)
        if: runner.os == 'Windows'
        run: |
          $VERSION = node -p "require('./package.json').version"
          $EXPECTED = "copair $VERSION (community)"
          $OUTPUT = .\copair.exe --version
          Write-Host "Expected: $EXPECTED, Got: $OUTPUT"
          if ($OUTPUT -ne $EXPECTED) { Write-Error "Version mismatch"; exit 1 }
          .\copair.exe --help | Out-Null
